[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmodel-hjepa"
version = "5.0.0"
description = "Hierarchical Joint-Embedding Predictive Architecture (H-JEPA) for Autonomous Machine Navigation in Complex Environments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Louis Poutrain" }
]
keywords = [
    "world-models",
    "jepa",
    "h-jepa",
    "reinforcement-learning",
    "autonomous-machine-intelligence",
    "self-supervised-learning",
    "sigreg",
    "pytorch"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.0.0",
    "imageio>=2.20.0",
    "imageio-ffmpeg>=0.4.5"
]

[project.optional-dependencies]
dev = [
    "pygame>=2.1.0",
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/LouisPoutrain/WorldModelTest"
Repository = "https://github.com/LouisPoutrain/WorldModelTest.git"
Documentation = "https://louispoutrain.github.io/WorldModelTest/docs/site/"

[tool.setuptools.packages.find]
include = ["modules*", "env*", "utils*"]
